# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Revoltes de la Terra
# email: your-email@example.com
description: >- # this means to ignore newlines until "baseurl:"
  Som revoltes de la terra, som la Terra que es revolta.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://www.revoltesdelaterra.cat" # the base hostname & protocol for your site, e.g. http://example.com
# twitter_username: jekyllrb
# github_username:  jekyll
lang: "ca"
locale: "ca_AD"
logo: "assets/imatges/logo.jpg"
show_excerpts: true

minima:
  date_format: "%e/%m/%Y"
#   Social Media Links.
#     Renders icons via Font Awesome Free webfonts CDN, based on ordered list of
#     entries (https://fontawesome.com/search?ip=brands). Valid entry keys:
#       * title    Tooltip rendered on hovering over icon.
#       * icon     Font Awesome icon id. `github` corresponds to `fa-github`.
#       * url      Full URL of social profile.
  social_links:
    - title: Revoltes de la Terra al Fediverse de Mastodon
      icon: mastodon
      url: https://mastodont.cat/@revoltesdelaterra
    - title: Revoltes de la Terra a Bluesky
      icon: bluesky
      url: https://bsky.app/profile/revoltesdelaterra.bsky.social
    - title: Canal de Revoltes de la Terra a Telegram
      icon: telegram
      url: "https://t.me/laterraqueesrevolta"
    - title: Revoltes de la Terra a Instagram
      icon: instagram
      url: "https://instagram.com/revoltesdelaterra"
    - title: Donatius
      icon: monero
      url: "monero:8C5aCckjGGoYimjLfSvwBtS2C97rGmWSG1vgqjx9YxkU93D41tECT1PTadXhugFQM9Pr1VAEtAQPqeB3umP74tDc3ZfCLJK"

# Build settings
# theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

future: true

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
